<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LFC Tigers pre-training</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LFC Training">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f4;--card:#fff;--ink:#1b2130;--sub:#5a6376;--line:#d5d9e2;--club:#111;--club-ink:#f2b705;--num:#111;--turf1:#3f9a3f;--turf2:#4aa94a;--mark:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121620;--card:#1b2130;--ink:#eef0f4;--sub:#a3abbd;--line:#2c3447;--club:#000;--num:#f2b705;--turf1:#2f7a31;--turf2:#378a39}}
:root[data-theme="dark"]{--bg:#121620;--card:#1b2130;--ink:#eef0f4;--sub:#a3abbd;--line:#2c3447;--club:#000;--num:#f2b705;--turf1:#2f7a31;--turf2:#378a39}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--club);z-index:10}
header{background:var(--club);color:var(--club-ink);padding:18px 20px 20px;display:flex;align-items:center;gap:14px}
.logo{width:76px;height:auto;flex:none}
header p{margin:0 0 4px;font-weight:500;opacity:.9}
header h1{margin:0;font:700 clamp(30px,9vw,44px)/1 "Barlow Condensed",Impact,sans-serif}
main{padding:16px 16px 40px;max-width:560px;margin:0 auto}
.hint{color:var(--sub);margin:4px 4px 14px}
.map{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:8px}
.map svg{display:block;width:100%;height:auto}
.pin{cursor:pointer}
.pin circle{fill:#f2b705;stroke:#111;stroke-width:3}
.pin text{fill:#111;font:700 20px "Barlow Condensed",sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin:focus-visible circle,.pin:hover circle{stroke:#fff;stroke-width:4}
.pin:focus{outline:none}
.list{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 0;padding:0;list-style:none}
.list button{font:500 17px Barlow,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 18px;cursor:pointer}
.list button b{color:var(--num);margin-right:8px}
.list button:focus-visible{outline:3px solid #ffd34d}
dialog{width:100%;max-width:560px;margin:auto auto 0;border:0;border-radius:24px 24px 0 0;background:var(--card);color:var(--ink);padding:24px 22px calc(28px + env(safe-area-inset-bottom,0px))}
dialog::backdrop{background:rgba(10,14,24,.55)}
dialog h2{margin:0;font:700 34px/1.05 "Barlow Condensed",Impact,sans-serif}
.meta{color:var(--sub);margin:4px 0 14px}
dialog h3{margin:16px 0 4px;font-size:16px}
dialog ol,dialog ul{margin:0;padding-left:22px}
dialog li{margin:4px 0}
.close{margin-top:22px;width:100%;font:600 17px Barlow,sans-serif;background:#f2b705;color:#111;border:0;border-radius:14px;padding:14px;cursor:pointer}
</style>
</head>
<body>
<header>
  <img class="logo" src="lfc-tigers-logo.png" alt="LFC Tigers">
  <div>
    <p id="club"></p>
    <h1 id="title"></h1>
  </div>
</header>
<main>
  <p class="hint">Find your station on the map, then tap its number to open the plan.</p>
  <div class="map">
    <svg viewBox="-10 -14 480 548" role="img" aria-label="Oval with numbered training stations">
      <defs><clipPath id="oval"><ellipse cx="200" cy="260" rx="188" ry="248"/></clipPath></defs>
      <ellipse cx="200" cy="260" rx="194" ry="254" fill="#8c9a8c"/>
      <g clip-path="url(#oval)" id="stripes"></g>
      <g fill="none" stroke="var(--mark)" stroke-width="2.5" opacity=".9">
        <ellipse cx="200" cy="260" rx="176" ry="236"/>
        <path d="M52 150 Q200 235 348 150"/>
        <path d="M52 370 Q200 285 348 370"/>
        <rect x="150" y="215" width="100" height="90"/>
        <circle cx="200" cy="260" r="16"/>
        <path d="M190 24.4A176 236 0 0 1 210 24.4V66H190Z"/>
        <path d="M190 495.6A176 236 0 0 0 210 495.6V454H190Z"/>
      </g>
      <g id="goalposts" stroke="#111" stroke-width="1.2">
        <path fill="none" stroke-linecap="butt" stroke="#111" stroke-width="4.6" d="M170 -8V27.4M230 -8V27.4M170 492.6V528M230 492.6V528"/><path fill="none" stroke-linecap="butt" stroke="#fff" stroke-width="2.4" d="M170 -8V27.4M230 -8V27.4M170 492.6V528M230 492.6V528"/>
        <path fill="none" stroke-linecap="butt" stroke="#111" stroke-width="5" d="M190 -12V24.4M210 -12V24.4M190 495.6V532M210 495.6V532"/><path fill="none" stroke-linecap="butt" stroke="#fff" stroke-width="3" d="M190 -12V24.4M210 -12V24.4M190 495.6V532M210 495.6V532"/>
      </g>
      <g id="buildings">
        <g transform="translate(-62 -90)" font-family="Barlow Condensed,Impact,sans-serif" font-weight="700">
        <rect x="384" y="78" width="82" height="10" fill="#1c2a2a"/>
        <text x="425" y="85.5" fill="#f2d675" font-size="6" text-anchor="middle">LOBETHAL FOOTBALL CLUB</text>
        <rect x="386" y="89" width="78" height="50" fill="#5f7f84"/>
        <rect x="389" y="92" width="72" height="44" fill="#1f2421"/>
        <text id="sbQ" x="391" y="98" fill="#e8924a" font-size="6">Q3</text>
        <text id="sbClock" x="459" y="98" fill="#e8924a" font-size="6.5" text-anchor="end">00:00</text>
        <text x="391" y="106" fill="#e8924a" font-size="6">LOBETHAL</text>
        <text id="sbAg" x="393" y="114" fill="#ece9f7" font-size="7">7</text>
        <text id="sbAb" x="410" y="114" fill="#ece9f7" font-size="7">5</text>
        <rect x="428" y="100" width="30" height="16" rx="2.5" fill="none" stroke="#cfd3dc" stroke-width="1"/>
        <text id="sbA" x="443" y="112.5" fill="#ece9f7" font-size="13" text-anchor="middle">47</text>
        <text x="391" y="125" fill="#e8924a" font-size="6">VISITORS</text>
        <text id="sbBg" x="393" y="133" fill="#ece9f7" font-size="7">3</text>
        <text id="sbBb" x="410" y="133" fill="#ece9f7" font-size="7">6</text>
        <rect x="428" y="119" width="30" height="16" rx="2.5" fill="none" stroke="#cfd3dc" stroke-width="1"/>
        <text id="sbB" x="443" y="131.5" fill="#ece9f7" font-size="13" text-anchor="middle">24</text>
        <rect x="386" y="140" width="78" height="9" fill="#111"/>
        <text x="425" y="147" fill="#f2b705" font-size="5.5" font-style="italic" text-anchor="middle">IN THE HILLS</text>
        </g>
        
        
        <defs><pattern id="solar" x="408" y="229" width="13" height="8.7" patternUnits="userSpaceOnUse"><rect width="13" height="8.7" fill="#1f3a6b" stroke="#7f9bcc" stroke-width=".8"/></pattern></defs>
        <rect x="402" y="225" width="64" height="70" rx="2" fill="#8d95a1" stroke="#111" stroke-width="2"/>
        <rect x="403" y="262" width="62" height="32" fill="#b4bac4"/>
        <rect x="408" y="229" width="52" height="26" fill="url(#solar)" stroke="#111" stroke-width=".8"/>
        <rect x="396" y="230" width="6" height="60" fill="#e3d3ac" stroke="#111" stroke-width="1"/>
        <rect x="397" y="238" width="4" height="8" fill="#2b2b2b"/>
        <rect x="397" y="257" width="4" height="8" fill="#2b2b2b"/>
        <rect x="397" y="276" width="4" height="8" fill="#2b2b2b"/>
        
        <defs><pattern id="solar2" x="408" y="263" width="13" height="8.7" patternUnits="userSpaceOnUse"><rect width="13" height="8.7" fill="#1f3a6b" stroke="#7f9bcc" stroke-width=".8"/></pattern></defs>
        <rect x="408" y="263" width="52" height="26" fill="url(#solar2)" stroke="#111" stroke-width=".8"/>
        <text x="434" y="219" fill="var(--ink)" font-family="Barlow Condensed,Impact,sans-serif" font-weight="700" font-size="11" text-anchor="middle">CHANGE ROOMS</text>
        
      </g>
      <g id="pins"></g>
    </svg>
  </div>
  <ul class="list" id="list"></ul>
</main>
<dialog id="sheet" aria-labelledby="sTitle">
  <h2 id="sTitle"></h2>
  <p class="meta" id="sMeta"></p>
  <h3>Set-up</h3><p id="sSetup" style="margin:0"></p>
  <h3>How it runs</h3><ol id="sSteps"></ol>
  <button class="close" id="close">Close</button>
</dialog>
<script>
/* ===== EDIT THIS SECTION EACH WEEK ===== */
const CLUB = "Lobethal Football Club";
const TITLE = "Week 1 · Mon 23 Nov";
/* x and y place the pin on the oval (0–400 across, 0–520 down) */
const STATIONS = [
  {n:1, name:"Box kick",        x:200, y:405, time:"8 min", setup:"Pairs, 15 m apart, one ball per pair.", steps:["Kick to your partner's chest.","Partner marks and returns the kick.","Swap feet every 5 kicks."]},
  {n:2, name:"Catch & release", x:200, y:260, time:"6 min", setup:"Groups of 3 in a triangle.", steps:["Catch with eyes on the ball.","Handball within one second.","Rotate clockwise."]},
  {n:3, name:"Narrow focus",    x:200, y:115, time:"6 min", setup:"Two lines, 5 m apart.", steps:["Receive on the move.","Call your target early.","Finish with a clean handball."]}
];
/* ======================================= */

const $ = id => document.getElementById(id);
$("club").textContent = CLUB;
$("title").textContent = TITLE;

// turf stripes
let s = "";
for (let i = 0; i < 10; i++) s += `<rect x="${i*40}" y="0" width="40" height="520" fill="${i%2 ? "var(--turf2)" : "var(--turf1)"}"/>`;
$("stripes").innerHTML = s;

const sheet = $("sheet");
function open(st){
  $("sTitle").textContent = st.n + ". " + st.name;
  $("sMeta").textContent = st.time;
  $("sSetup").textContent = st.setup;
  $("sSteps").innerHTML = st.steps.map(t => "<li></li>").join("");
  [...$("sSteps").children].forEach((li,i) => li.textContent = st.steps[i]);
  sheet.showModal();
}

STATIONS.forEach(st => {
  const NS = "http://www.w3.org/2000/svg";
  const g = document.createElementNS(NS,"g");
  g.setAttribute("class","pin"); g.setAttribute("tabindex","0");
  g.setAttribute("role","button"); g.setAttribute("aria-label","Station " + st.n + ": " + st.name);
  g.innerHTML = `<circle cx="${st.x}" cy="${st.y}" r="17"/><text x="${st.x}" y="${st.y+1}">${st.n}</text>`;
  g.addEventListener("click", () => open(st));
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(st); } });
  $("pins").appendChild(g);

  const li = document.createElement("li");
  const b = document.createElement("button");
  b.innerHTML = "<b></b><span></span>";
  b.firstChild.textContent = st.n; b.lastChild.textContent = st.name;
  b.addEventListener("click", () => open(st));
  li.appendChild(b); $("list").appendChild(li);
});

$("close").addEventListener("click", () => sheet.close());

// animated scoreboard (skipped if the device asks for reduced motion)
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
  const sb = {
    a: {g: $("sbAg"), b: $("sbAb"), t: $("sbA"), s: {g: 7, b: 5}},
    v: {g: $("sbBg"), b: $("sbBb"), t: $("sbB"), s: {g: 3, b: 6}}
  };
  const flash = el => { el.style.fill = "#f2b705"; setTimeout(() => el.style.fill = "", 700); };
  let secs = 0, next = 6;
  setInterval(() => {
    secs++;
    $("sbClock").textContent = String(Math.floor(secs / 60) % 100).padStart(2, "0") + ":" + String(secs % 60).padStart(2, "0");
    if (secs >= next) {
      next = secs + 6 + Math.floor(Math.random() * 7);
      const goal = Math.random() < .4;
      let t = sb[Math.random() < .65 ? "a" : "v"];
      const pts = goal ? 6 : 1, tot = x => x.s.g * 6 + x.s.b;
      if (t === sb.v && tot(sb.v) + pts >= tot(sb.a)) t = sb.a; // Lobethal always stays in front
      
      t.s[goal ? "g" : "b"]++;
      t.g.textContent = t.s.g; t.b.textContent = t.s.b;
      t.t.textContent = t.s.g * 6 + t.s.b;
      flash(t.t); flash(goal ? t.g : t.b);
    }
  }, 1000);
}
sheet.addEventListener("click", e => { if (e.target === sheet) sheet.close(); });
</script>
</body>
</html>
